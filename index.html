<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#2b2b39" />
  <meta name="description" content="A cozy waiting-tables sim built with Phaser + Modern Interiors." />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="game-assets/ui/icon.png" />
  <title>Waiting Game</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #1b1b22; overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; }
    #game-container { width: 100vw; height: 100vh; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    #boot-fallback {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #c9c9d6; font-size: 18px; text-align: center; padding: 20px;
    }
    #boot-fallback a { color: #8fb6ff; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <div id="boot-fallback">
    <div>
      Loading Waiting Game…<br />
      If this persists, serve the folder over HTTP (e.g. <code>npx serve</code>) and reload.
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
